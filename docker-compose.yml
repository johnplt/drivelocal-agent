services:
  db:
    image: pgvector/pgvector:pg16
    container_name: drivelocal_db
    restart: always
    environment:
      POSTGRES_DB: drivelocal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: drivelocal_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/drivelocal
    ports:
      - "8000:8000"
    depends_on:
      - db

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: drivelocal_ui
    restart: always
    environment:
      - API_URL=http://api:8000/api/arbitrer
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata: