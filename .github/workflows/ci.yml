name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Service PostgreSQL avec pgvector pour exécuter les tests d'intégration
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: drivelocal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Initialize Database Schema and Seed Data
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgrespassword@localhost:5435/drivelocal')
          cur = conn.cursor()
          with open('docker/init-db.sql') as f:
              cur.execute(f.read())
          conn.commit()
          conn.close()
          "
          uv run python app/seed.py

      - name: Run Pytest
        run: uv run pytest