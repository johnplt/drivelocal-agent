name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Service PostgreSQL avec pgvector pour exécuter les tests d'intégration
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: drivelocal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # SCAN DE SECRETS
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest
        run: uv run pytest

      # SCAN DOS & SÉCURITÉ CODE (Bandit)
      - name: Scan des faiblesses de code (Bandit)
        run: uvx bandit -r . -x ./.venv -ll

      # 4 TESTS UNITAIRES & COUVERTURE (Optionnel : si présence de tests)
      - name: Lancer les tests avec couverture
        run: |
          uv pip install pytest pytest-cov
          uv run pytest --cov=. --cov-report=term-missing

      # SCAN DE VULNÉRABILITÉS (Trivy)
      - name: Scan des vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'