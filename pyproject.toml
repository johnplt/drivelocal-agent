[project]
name = "drivelocal"
version = "0.1.0"
description = "DriveLocal Agent - Recherche sémantique et arbitrage de location"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "huggingface-hub>=0.20.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
